kind: Service
apiVersion: v1
metadata:
  name: productservice
  labels:
    app: productservice
spec:
  type: ClusterIP
  selector:
    app: productservice
  ports:
    - name: tcp
      port: 8080
      protocol: TCP
      targetPort: 8080
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: productservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productservice
  template:
    metadata:
      labels:
        app: productservice
        version: v1
    spec:
      containers:
      - name: productservice
        image: productservice
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
